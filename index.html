
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxynex AI - Universal Chat Interface</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        voxynex: {
                            bg: '#131314',
                            sidebar: '#1e1f20',
                            card: '#1e1f20',
                            cardHover: '#28292a',
                            inputBg: '#1e1f20',
                            border: '#37393b',
                            accent: '#a8c7fa',
                            userBubble: '#2b2c2e'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        /* Prevent mobile bounce and lock to exact dynamic viewport height */
        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }

        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s infinite;
            color: #60a5fa;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } }
        .recording-pulse { animation: pulse-red 1.2s infinite ease-in-out; color: #ef4444 !important; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-voxynex-bg text-gray-800 dark:text-gray-100 font-sans h-[100dvh] w-screen flex overflow-hidden">

    <!-- SIDEBAR (Absolute Overlay on Mobile so it doesn't shrink the chat layout) -->
    <aside id="sidebar" class="w-72 bg-gray-50 dark:bg-voxynex-sidebar border-r border-gray-200 dark:border-voxynex-border flex flex-col justify-between flex-shrink-0 transition-transform duration-300 z-40 fixed md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0 h-full shadow-2xl md:shadow-none">
        <!-- Top Section -->
        <div class="p-4 flex flex-col h-full overflow-hidden">
            <!-- Sidebar Header & New Chat Button -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2 px-1">
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-xs font-bold">V</div>
                    <span class="font-bold tracking-wide text-sm bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Voxynex AI</span>
                </div>
                <button id="closeSidebarBtn" class="md:hidden p-2 text-gray-500 hover:text-gray-700 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <button id="newChatBtn" class="flex items-center justify-center gap-3 w-full px-4 py-3 mb-3 bg-gray-200 dark:bg-voxynex-card hover:bg-gray-300 dark:hover:bg-voxynex-cardHover rounded-full transition-colors text-sm font-medium shadow-sm">
                <i class="fa-solid fa-plus text-blue-500"></i>
                <span>New Chat</span>
            </button>

            <!-- Chat History Search Bar -->
            <div class="relative mb-3">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="chatSearchInput" placeholder="Search chats..." class="w-full pl-9 pr-3 py-1.5 text-xs bg-gray-100 dark:bg-voxynex-inputBg border border-gray-200 dark:border-voxynex-border rounded-lg outline-none focus:border-blue-500 text-gray-900 dark:text-gray-100 placeholder-gray-400">
            </div>

            <!-- Chat History Header -->
            <div class="text-xs font-semibold text-gray-400 dark:text-gray-400 px-3 my-1 uppercase tracking-wider">Recent Chats</div>
            
            <!-- Chat List -->
            <div id="chatHistoryList" class="flex-1 overflow-y-auto space-y-1 pr-1">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Bottom Sidebar Tools -->
        <div class="p-3 border-t border-gray-200 dark:border-voxynex-border space-y-1">
            <button id="clearAllChatsBtn" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg transition-colors">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear History</span>
            </button>
            <button id="openSettingsBtn" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm hover:bg-gray-200 dark:hover:bg-voxynex-cardHover rounded-lg transition-colors">
                <i class="fa-solid fa-gear text-gray-400"></i>
                <span>Settings</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CHAT CONTAINER -->
    <main class="flex-1 flex flex-col h-full w-full relative overflow-hidden bg-white dark:bg-voxynex-bg">

    <!-- MAIN CHAT CONTAINER -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-white dark:bg-voxynex-bg">
        
        <!-- Header Bar -->
        <header class="h-14 border-b border-gray-200 dark:border-voxynex-border flex items-center justify-between px-4 z-10">
            <div class="flex items-center gap-3">
                <button id="toggleSidebarBtn" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-voxynex-card text-gray-600 dark:text-gray-300">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="flex items-center gap-2 flex-wrap">
                    <span id="currentModelBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
                        google/gemini-2.5-flash
                    </span>
                    <span id="webSearchStatus" class="hidden text-xs px-2 py-0.5 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded">
                        <i class="fa-solid fa-globe text-xs mr-1"></i>Search Grounding
                    </span>
                </div>
            </div>

            <!-- Top Actions -->
            <div class="flex items-center gap-2">
                <button id="exportChatBtn" title="Export Chat" class="p-2 text-gray-500 hover:text-gray-700 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-voxynex-card transition">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button id="themeToggleBtn" title="Toggle Theme" class="p-2 text-gray-500 hover:text-gray-700 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-voxynex-card transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- CHAT VIEWPORT -->
        <div id="chatArea" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
            
            <!-- HERO / WELCOME VIEW -->
            <div id="heroView" class="h-full flex flex-col justify-center items-center text-center space-y-6 py-12">
                <div class="space-y-2">
                    <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 bg-clip-text text-transparent">
                        Hello, Creator
                    </h1>
                    <p class="text-gray-500 dark:text-gray-400 text-lg">How can Voxynex assist your workflow today?</p>
                </div>

                <!-- Suggested Prompt Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 w-full max-w-3xl mt-6">
                    <button class="promptCard p-4 rounded-xl border border-gray-200 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card hover:bg-gray-100 dark:hover:bg-voxynex-cardHover text-left flex flex-col justify-between h-32 transition">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Write a Python script for web scraping</span>
                        <i class="fa-solid fa-code text-blue-400 self-end"></i>
                    </button>
                    <button class="promptCard p-4 rounded-xl border border-gray-200 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card hover:bg-gray-100 dark:hover:bg-voxynex-cardHover text-left flex flex-col justify-between h-32 transition">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Explain quantum computing simply</span>
                        <i class="fa-solid fa-atom text-purple-400 self-end"></i>
                    </button>
                    <button class="promptCard p-4 rounded-xl border border-gray-200 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card hover:bg-gray-100 dark:hover:bg-voxynex-cardHover text-left flex flex-col justify-between h-32 transition">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Draft a strategic business plan outline</span>
                        <i class="fa-solid fa-lightbulb text-yellow-400 self-end"></i>
                    </button>
                    <button class="promptCard p-4 rounded-xl border border-gray-200 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card hover:bg-gray-100 dark:hover:bg-voxynex-cardHover text-left flex flex-col justify-between h-32 transition">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Help debug a complex JavaScript error</span>
                        <i class="fa-solid fa-bug text-red-400 self-end"></i>
                    </button>
                </div>
            </div>

            <!-- Messages Stream Container -->
            <div id="messagesList" class="space-y-6 hidden"></div>
        </div>

        <!-- FOOTER / INPUT BAR (Always Visible) -->
        <div class="p-3 md:p-4 border-t border-gray-200 dark:border-voxynex-border max-w-4xl w-full mx-auto bg-white dark:bg-voxynex-bg">
            
            <!-- Features Toolbar Toggles -->
            <div class="flex items-center gap-2 mb-2 px-1 overflow-x-auto text-xs">
                <button id="toggleWebSearch" class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-gray-300 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card text-gray-600 dark:text-gray-300 hover:border-blue-500 transition">
                    <i class="fa-solid fa-globe"></i>
                    <span>Search Grounding</span>
                </button>
                <button id="toggleReasoning" class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-gray-300 dark:border-voxynex-border bg-gray-50 dark:bg-voxynex-card text-gray-600 dark:text-gray-300 hover:border-purple-500 transition">
                    <i class="fa-solid fa-brain"></i>
                    <span>Reasoning Mode</span>
                </button>
                <span id="filePreviewBadge" class="hidden flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300">
                    <i class="fa-solid fa-paperclip"></i>
                    <span id="fileName">file.txt</span>
                    <i id="removeFileBtn" class="fa-solid fa-xmark cursor-pointer ml-1 hover:text-red-500"></i>
                </span>
            </div>

            <!-- Input Box Shell -->
            <div class="relative bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-blue-500 transition-all p-2 flex flex-col">
                <textarea id="userInput" rows="1" placeholder="Ask Voxynex anything or upload a PDF/file..." class="w-full bg-transparent border-none outline-none resize-none px-3 py-2 text-sm md:text-base max-h-48 overflow-y-auto placeholder-gray-400 dark:placeholder-gray-500 text-gray-900 dark:text-gray-100"></textarea>
                
                <div class="flex items-center justify-between pt-2 px-2 border-t border-gray-200 dark:border-voxynex-border/50">
                    <div class="flex items-center gap-1">
                        <!-- Attachment Button (PDF, Text, Docs) -->
                        <label for="fileInput" title="Attach PDF, Text or Code File" class="p-2 text-gray-500 hover:text-blue-500 rounded-full hover:bg-gray-200 dark:hover:bg-voxynex-cardHover cursor-pointer transition">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.doc,.docx,.js,.html,.csv">
                        
                        <!-- Voice Mic Input -->
                        <button id="voiceInputBtn" title="Speech to Text" class="p-2 text-gray-500 hover:text-blue-500 rounded-full hover:bg-gray-200 dark:hover:bg-voxynex-cardHover transition">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="sendBtn" class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 disabled:opacity-40 disabled:hover:bg-blue-600 transition w-9 h-9 flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </div>
            <p class="text-center text-[10px] text-gray-400 dark:text-gray-500 mt-2">Voxynex AI can make mistakes. Verify important information.</p>
        </div>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-voxynex-sidebar border border-gray-200 dark:border-voxynex-border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-200 dark:border-voxynex-border pb-3">
                <h3 class="text-lg font-bold">Voxynex Settings</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4 text-sm">
                <!-- OpenRouter API Key -->
                <div>
                    <label class="block font-medium mb-1">OpenRouter API Key (Optional)</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border outline-none focus:border-blue-500 text-gray-900 dark:text-gray-100">
                    <p class="text-[11px] text-gray-400 mt-1">Leave empty to use built-in Mock Streaming Mode for testing.</p>
                </div>

                <!-- Model Selection -->
                <div>
                    <label class="block font-medium mb-1">Select AI Model</label>
                    <select id="modelSelect" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border outline-none focus:border-blue-500 text-gray-900 dark:text-gray-100">
                        <option value="google/gemini-2.5-flash">google/gemini-2.5-flash (Fast)</option>
                        <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet</option>
                        <option value="openai/gpt-4o">openai/gpt-4o</option>
                        <option value="deepseek/deepseek-r1">deepseek/deepseek-r1 (Reasoning)</option>
                        <option value="custom">Custom Model Name...</option>
                    </select>
                </div>

                <!-- Custom Model Input -->
                <div id="customModelContainer" class="hidden">
                    <label class="block font-medium mb-1">Custom OpenRouter Model String</label>
                    <input type="text" id="customModelInput" placeholder="meta-llama/llama-3-70b-instruct" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border outline-none focus:border-blue-500 text-gray-900 dark:text-gray-100">
                </div>

                <!-- System Instructions -->
                <div>
                    <label class="block font-medium mb-1">System Prompt</label>
                    <textarea id="systemPromptInput" rows="2" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border outline-none focus:border-blue-500 resize-none text-gray-900 dark:text-gray-100" placeholder="You are a helpful assistant..."></textarea>
                </div>

                <!-- Max Tokens Input -->
                <div>
                    <label class="block font-medium mb-1">Max Output Tokens</label>
                    <input type="number" id="maxTokensInput" min="256" max="16384" step="256" value="4096" class="w-full px-3 py-2 rounded-lg bg-gray-100 dark:bg-voxynex-inputBg border border-gray-300 dark:border-voxynex-border outline-none focus:border-blue-500 text-gray-900 dark:text-gray-100">
                </div>

                <!-- Temperature Slider -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="font-medium">Temperature</label>
                        <span id="tempVal" class="text-xs text-gray-400">0.7</span>
                    </div>
                    <input type="range" id="tempInput" min="0" max="1" step="0.1" value="0.7" class="w-full">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-gray-200 dark:border-voxynex-border">
                <button id="saveSettingsBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition text-sm">
                    Save Settings
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT CONTAINER -->
    <script>
        // State Management
        let appState = {
            apiKey: localStorage.getItem('voxynex_api_key') || '',
            model: localStorage.getItem('voxynex_model') || 'google/gemini-2.5-flash',
            systemPrompt: localStorage.getItem('voxynex_sys_prompt') || 'You are Voxynex, a helpful, expert AI assistant.',
            temperature: parseFloat(localStorage.getItem('voxynex_temp') || '0.7'),
            maxTokens: parseInt(localStorage.getItem('voxynex_max_tokens') || '4096', 10),
            chats: JSON.parse(localStorage.getItem('voxynex_chats') || '[]'),
            currentChatId: null,
            isWebSearchActive: false,
            isReasoningActive: false,
            attachedFile: null,
            isGenerating: false,
            searchQuery: ''
        };

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatHistoryList = document.getElementById('chatHistoryList');
        const chatSearchInput = document.getElementById('chatSearchInput');
        const clearAllChatsBtn = document.getElementById('clearAllChatsBtn');
        
        const heroView = document.getElementById('heroView');
        const messagesList = document.getElementById('messagesList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentModelBadge = document.getElementById('currentModelBadge');

        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelSelect = document.getElementById('modelSelect');
        const customModelContainer = document.getElementById('customModelContainer');
        const customModelInput = document.getElementById('customModelInput');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const maxTokensInput = document.getElementById('maxTokensInput');
        const tempInput = document.getElementById('tempInput');
        const tempVal = document.getElementById('tempVal');

        const toggleWebSearch = document.getElementById('toggleWebSearch');
        const webSearchStatus = document.getElementById('webSearchStatus');
        const toggleReasoning = document.getElementById('toggleReasoning');
        const fileInput = document.getElementById('fileInput');
        const filePreviewBadge = document.getElementById('filePreviewBadge');
        const fileNameSpan = document.getElementById('fileName');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const voiceInputBtn = document.getElementById('voiceInputBtn');
        const exportChatBtn = document.getElementById('exportChatBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initSettingsUI();
            renderChatHistory();
            setupEventListeners();
            autoResizeTextarea();
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                }
            });
        });

        // Event Listeners Setup
        function setupEventListeners() {
            toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));
            closeSidebarBtn.addEventListener('click', () => sidebar.classList.add('-translate-x-full'));
            
            newChatBtn.addEventListener('click', createNewChat);
            clearAllChatsBtn.addEventListener('click', clearAllChats);
            chatSearchInput.addEventListener('input', (e) => {
                appState.searchQuery = e.target.value.toLowerCase();
                renderChatHistory();
            });

            userInput.addEventListener('input', autoResizeTextarea);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            sendBtn.addEventListener('click', sendMessage);

            document.querySelectorAll('.promptCard').forEach(card => {
                card.addEventListener('click', () => {
                    userInput.value = card.querySelector('span').innerText;
                    sendMessage();
                });
            });

            toggleWebSearch.addEventListener('click', () => {
                appState.isWebSearchActive = !appState.isWebSearchActive;
                toggleWebSearch.classList.toggle('border-blue-500', appState.isWebSearchActive);
                toggleWebSearch.classList.toggle('bg-blue-50', appState.isWebSearchActive);
                webSearchStatus.classList.toggle('hidden', !appState.isWebSearchActive);
            });

            toggleReasoning.addEventListener('click', () => {
                appState.isReasoningActive = !appState.isReasoningActive;
                toggleReasoning.classList.toggle('border-purple-500', appState.isReasoningActive);
                toggleReasoning.classList.toggle('bg-purple-50', appState.isReasoningActive);
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    
                    // Support reading text/PDF/source code files locally
                    reader.onload = function(event) {
                        appState.attachedFile = {
                            name: file.name,
                            content: event.target.result
                        };
                        fileNameSpan.innerText = file.name;
                        filePreviewBadge.classList.remove('hidden');
                    };
                    
                    if (file.type.includes('image')) {
                        reader.readAsDataURL(file);
                    } else {
                        reader.readAsText(file);
                    }
                }
            });

            removeFileBtn.addEventListener('click', () => {
                appState.attachedFile = null;
                fileInput.value = '';
                filePreviewBadge.classList.add('hidden');
            });

            // Speech Recognition (Speech to Text)
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => voiceInputBtn.classList.add('recording-pulse');
                recognition.onend = () => voiceInputBtn.classList.remove('recording-pulse');
                recognition.onerror = () => voiceInputBtn.classList.remove('recording-pulse');
                recognition.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    userInput.value += (userInput.value ? ' ' : '') + transcript;
                    autoResizeTextarea();
                };
                voiceInputBtn.addEventListener('click', () => {
                    try { recognition.start(); } catch(err) { recognition.stop(); }
                });
            } else {
                voiceInputBtn.title = "Speech recognition not supported in this browser";
                voiceInputBtn.style.opacity = "0.5";
            }

            themeToggleBtn.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            openSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
            closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
            modelSelect.addEventListener('change', (e) => {
                customModelContainer.classList.toggle('hidden', e.target.value !== 'custom');
            });
            tempInput.addEventListener('input', (e) => tempVal.innerText = e.target.value);
            saveSettingsBtn.addEventListener('click', saveSettings);

            exportChatBtn.addEventListener('click', exportChat);
        }

        function autoResizeTextarea() {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 192) + 'px';
        }

        function initSettingsUI() {
            apiKeyInput.value = appState.apiKey;
            systemPromptInput.value = appState.systemPrompt;
            maxTokensInput.value = appState.maxTokens;
            tempInput.value = appState.temperature;
            tempVal.innerText = appState.temperature;

            if (['google/gemini-2.5-flash', 'anthropic/claude-3.5-sonnet', 'openai/gpt-4o', 'deepseek/deepseek-r1'].includes(appState.model)) {
                modelSelect.value = appState.model;
            } else {
                modelSelect.value = 'custom';
                customModelContainer.classList.remove('hidden');
                customModelInput.value = appState.model;
            }
            currentModelBadge.innerText = appState.model;
        }

        function saveSettings() {
            appState.apiKey = apiKeyInput.value.trim();
            appState.model = modelSelect.value === 'custom' ? customModelInput.value.trim() : modelSelect.value;
            appState.systemPrompt = systemPromptInput.value.trim();
            appState.temperature = parseFloat(tempInput.value);
            appState.maxTokens = parseInt(maxTokensInput.value, 10) || 4096;

            localStorage.setItem('voxynex_api_key', appState.apiKey);
            localStorage.setItem('voxynex_model', appState.model);
            localStorage.setItem('voxynex_sys_prompt', appState.systemPrompt);
            localStorage.setItem('voxynex_temp', appState.temperature);
            localStorage.setItem('voxynex_max_tokens', appState.maxTokens);

            currentModelBadge.innerText = appState.model;
            settingsModal.classList.add('hidden');
        }

        function renderChatHistory() {
            chatHistoryList.innerHTML = '';
            const filteredChats = appState.chats.filter(chat => 
                chat.title.toLowerCase().includes(appState.searchQuery)
            );

            filteredChats.forEach(chat => {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-left truncate transition ${
                    chat.id === appState.currentChatId 
                    ? 'bg-blue-100 dark:bg-voxynex-card text-blue-600 dark:text-blue-400 font-medium' 
                    : 'hover:bg-gray-200 dark:hover:bg-voxynex-cardHover text-gray-700 dark:text-gray-300'
                }`;
                btn.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <i class="fa-regular fa-message text-xs"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <i class="fa-solid fa-xmark text-xs opacity-0 hover:opacity-100 text-gray-400 hover:text-red-400 p-1" onclick="deleteChat(event, '${chat.id}')"></i>
                `;
                btn.addEventListener('click', () => loadChat(chat.id));
                chatHistoryList.appendChild(btn);
            });
        }

        function createNewChat() {
            appState.currentChatId = null;
            heroView.classList.remove('hidden');
            messagesList.classList.add('hidden');
            messagesList.innerHTML = '';
            userInput.value = '';
            renderChatHistory();
        }

        function loadChat(chatId) {
            const chat = appState.chats.find(c => c.id === chatId);
            if (!chat) return;

            appState.currentChatId = chatId;
            heroView.classList.add('hidden');
            messagesList.classList.remove('hidden');
            messagesList.innerHTML = '';

            chat.messages.forEach((msg, idx) => appendMessageBubble(msg.role, msg.content, false, idx));
            renderChatHistory();
        }

        window.deleteChat = function(e, chatId) {
            e.stopPropagation();
            appState.chats = appState.chats.filter(c => c.id !== chatId);
            localStorage.setItem('voxynex_chats', JSON.stringify(appState.chats));
            if (appState.currentChatId === chatId) createNewChat();
            else renderChatHistory();
        };

        function clearAllChats() {
            if (confirm("Are you sure you want to clear all chat history?")) {
                appState.chats = [];
                localStorage.removeItem('voxynex_chats');
                createNewChat();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if ((!text && !appState.attachedFile) || appState.isGenerating) return;

            let fullContent = text;
            if (appState.attachedFile) {
                fullContent += `\n\n--- Attachment: **${appState.attachedFile.name}** ---\n\`\`\`\n${typeof appState.attachedFile.content === 'string' ? appState.attachedFile.content.slice(0, 3000) : '[Binary Data]'}\n\`\`\``;
            }

            if (!appState.currentChatId) {
                const newChat = {
                    id: Date.now().toString(),
                    title: text.slice(0, 30) || (appState.attachedFile ? `File: ${appState.attachedFile.name}` : 'New Query'),
                    messages: []
                };
                appState.chats.unshift(newChat);
                appState.currentChatId = newChat.id;
            }

            userInput.value = '';
            autoResizeTextarea();
            appState.attachedFile = null;
            fileInput.value = '';
            filePreviewBadge.classList.add('hidden');
            heroView.classList.add('hidden');
            messagesList.classList.remove('hidden');

            const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
            currentChat.messages.push({ role: 'user', content: fullContent });
            const userMsgIndex = currentChat.messages.length - 1;
            appendMessageBubble('user', fullContent, false, userMsgIndex);

            await generateAssistantResponse(currentChat);
        }

        async function generateAssistantResponse(currentChat) {
            appState.isGenerating = true;
            sendBtn.disabled = true;

            const aiMsgIndex = currentChat.messages.length;
            const aiBubble = appendMessageBubble('assistant', '', true, aiMsgIndex);
            const contentDiv = aiBubble.querySelector('.message-content');

            // Fallback to Mock Streaming Mode if no API Key is set
            if (!appState.apiKey) {
                await simulateMockStreaming(currentChat, contentDiv);
                appState.isGenerating = false;
                sendBtn.disabled = false;
                return;
            }

            try {
                let apiMessages = [
                    { role: 'system', content: appState.systemPrompt }
                ];

                if (appState.isWebSearchActive) {
                    apiMessages.push({ role: 'system', content: 'Search Grounding Active: Access up-to-date real-time context where helpful.' });
                }
                if (appState.isReasoningActive) {
                    apiMessages.push({ role: 'system', content: 'Reasoning Mode: Show step-by-step thinking before giving the final answer.' });
                }

                apiMessages = apiMessages.concat(currentChat.messages);

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appState.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Voxynex AI Interface'
                    },
                    body: JSON.stringify({
                        model: appState.model,
                        messages: apiMessages,
                        temperature: appState.temperature,
                        max_tokens: appState.maxTokens,
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let streamedContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                const token = parsed.choices[0]?.delta?.content || '';
                                streamedContent += token;
                                contentDiv.innerHTML = marked.parse(streamedContent);
                                addCodeCopyButtons(contentDiv);
                                scrollChatToBottom();
                            } catch (err) {}
                        }
                    }
                }

                contentDiv.classList.remove('typing-cursor');
                currentChat.messages.push({ role: 'assistant', content: streamedContent });
                localStorage.setItem('voxynex_chats', JSON.stringify(appState.chats));
                renderChatHistory();

                loadChat(appState.currentChatId);

            } catch (err) {
                contentDiv.classList.remove('typing-cursor');
                contentDiv.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${escapeHtml(err.message)}</span>`;
            } finally {
                appState.isGenerating = false;
                sendBtn.disabled = false;
            }
        }

        // Mock Streaming Response Simulator when no API Key is present
        async function simulateMockStreaming(currentChat, contentDiv) {
            const userText = currentChat.messages[currentChat.messages.length - 1].content;
            const mockMarkdown = `### Voxynex AI Response

Thank you for testing **Voxynex**! 

*Notice: You are currently running in **Mock Fallback Mode** because no OpenRouter API key was entered in Settings.*

#### Here is a sample code snippet based on your query:
\`\`\`javascript
// Sample output for prompt: "${userText.slice(0, 30)}..."
function startVoxynex() {
    console.log("Voxynex AI ready to process queries and files!");
}
startVoxynex();
\`\`\`

To connect live models (Gemini 2.5, Claude 3.5 Sonnet, GPT-4o, DeepSeek R1), open **Settings** and add your **OpenRouter API Key**.`;

            let currentString = "";
            const words = mockMarkdown.split(" ");
            
            for (let i = 0; i < words.length; i++) {
                currentString += words[i] + " ";
                contentDiv.innerHTML = marked.parse(currentString);
                addCodeCopyButtons(contentDiv);
                scrollChatToBottom();
                await new Promise(resolve => setTimeout(resolve, 30));
            }

            contentDiv.classList.remove('typing-cursor');
            currentChat.messages.push({ role: 'assistant', content: mockMarkdown });
            localStorage.setItem('voxynex_chats', JSON.stringify(appState.chats));
            renderChatHistory();
            loadChat(appState.currentChatId);
        }

        // Render Message Bubble with Actions
        function appendMessageBubble(role, content, isStreaming = false, index = null) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-3 md:gap-4 ${isUser ? 'justify-end' : 'justify-start'}`;

            const avatar = isUser 
                ? `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">YOU</div>`
                : `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0"><i class="fa-solid fa-bolt"></i></div>`;

            const bubbleCss = isUser
                ? 'bg-gray-200 dark:bg-voxynex-userBubble text-gray-900 dark:text-gray-100 rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%]'
                : 'bg-transparent text-gray-900 dark:text-gray-100 px-1 py-1 max-w-[90%] w-full';

            const parsedContent = isUser ? escapeHtml(content) : marked.parse(content || '');

            wrapper.innerHTML = `
                ${!isUser ? avatar : ''}
                <div class="${bubbleCss}">
                    <div class="message-content prose dark:prose-invert max-w-none text-sm md:text-base ${isStreaming ? 'typing-cursor' : ''}">
                        ${parsedContent}
                    </div>
                    ${!isStreaming && index !== null ? `
                        <div class="flex items-center gap-2 mt-3 text-xs text-gray-400">
                            <button onclick="copyToClipboard(this)" class="hover:text-gray-200 p-1" title="Copy Message"><i class="fa-regular fa-copy"></i></button>
                            ${!isUser ? `<button onclick="regenerateMessage(${index})" class="hover:text-gray-200 p-1" title="Regenerate Response"><i class="fa-solid fa-rotate"></i></button>` : ''}
                            ${isUser ? `<button onclick="editPrompt(${index})" class="hover:text-gray-200 p-1" title="Edit Prompt"><i class="fa-solid fa-pen"></i></button>` : ''}
                            <button onclick="speakText(this)" class="hover:text-gray-200 p-1" title="Read Aloud"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                    ` : ''}
                </div>
                ${isUser ? avatar : ''}
            `;

            messagesList.appendChild(wrapper);
            if (!isUser) addCodeCopyButtons(wrapper);
            scrollChatToBottom();
            return wrapper;
        }

        // Copy Code Button Injector
        function addCodeCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;
                const button = document.createElement('button');
                button.className = 'copy-code-btn absolute top-2 right-2 px-2 py-1 bg-gray-800 text-gray-300 hover:text-white rounded text-xs flex items-center gap-1 opacity-80 hover:opacity-100 transition';
                button.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                button.onclick = () => {
                    const codeText = pre.querySelector('code')?.innerText || '';
                    navigator.clipboard.writeText(codeText);
                    button.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copied!';
                    setTimeout(() => button.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
                };
                pre.style.position = 'relative';
                pre.appendChild(button);
            });
        }

        window.copyToClipboard = function(btn) {
            const content = btn.closest('.message-content')?.innerText || '';
            navigator.clipboard.writeText(content);
            btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i>';
            setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i>', 2000);
        };

        window.speakText = function(btn) {
            const content = btn.closest('.message-content')?.innerText || '';
            if (!content) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(content);
            window.speechSynthesis.speak(utterance);
        };

        window.regenerateMessage = async function(index) {
            const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
            if (!currentChat || appState.isGenerating) return;

            currentChat.messages = currentChat.messages.slice(0, index);
            loadChat(appState.currentChatId);
            await generateAssistantResponse(currentChat);
        };

        window.editPrompt = function(index) {
            const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
            if (!currentChat) return;
            const promptText = currentChat.messages[index].content;
            userInput.value = promptText;
            autoResizeTextarea();
            userInput.focus();
        };

        function scrollChatToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function exportChat() {
            const currentChat = appState.chats.find(c => c.id === appState.currentChatId);
            if (!currentChat) return alert("No active chat to export.");
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentChat, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `${currentChat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }
    </script>
</body>
</html>
